name: Daily update (MLB + WNBA)

on:
  schedule:
    # Hourly at :10 past, from 2 pm to 10 pm ET. Times are UTC (GitHub cron is
    # UTC-only); baseball/WNBA seasons are all EDT (UTC-4), so 2–10 pm ET = 18:00
    # UTC through 02:00 UTC next day. The 2 pm run has the slate ready before 3 pm;
    # each later hourly run re-pulls whatever lineups have since been confirmed,
    # so the dashboard keeps refreshing as final lineups post. :10 (not :00)
    # because GitHub delays scheduled runs most at the top of the hour.
    - cron: '10 18-23,0-2 * * *'
  workflow_dispatch:  # allow manual "Run workflow" button

# Only one build/deploy at a time; don't cancel a running deploy.
concurrency:
  group: mlb-daily
  cancel-in-progress: false

permissions:
  contents: write   # commit generated JSON back to main
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install — everything is stdlib. That keeps this workflow fast + hermetic.

      - name: Compute target dates (today + tomorrow in ET)
        id: target
        run: |
          # Generate a 2-day window so the calendar shows the upcoming slate ahead
          # of time (tomorrow = probable pitchers + opening lines), while today keeps
          # refreshing with confirmed lineups on each hourly run.
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          TOMORROW=$(TZ='America/New_York' date -d "+1 day" +%Y-%m-%d 2>/dev/null \
                     || TZ='America/New_York' date -v+1d +%Y-%m-%d)
          echo "dates=$TODAY $TOMORROW" >> $GITHUB_OUTPUT
          echo "Targeting slate for $TODAY and $TOMORROW"

      # ---- MLB ----  (scraper writes per-date CSV; predict embeds it into each JSON)
      - name: Run MLB pipeline (ESPN odds + MLB StatsAPI) for the window
        run: |
          for D in ${{ steps.target.outputs.dates }}; do
            echo "=== MLB $D ==="
            python mlb_tonight_edates.py "$D"
            python mlb_predict.py "$D"
          done

      # Grade the last few weeks of picks vs actual results + closing lines, and
      # write data/performance.json (CLV, record, ROI) for the dashboard panel.
      - name: Grade past picks (CLV + performance)
        continue-on-error: true   # never block the deploy on grading
        run: |
          END=$(TZ='America/New_York' date +%Y-%m-%d)
          START=$(TZ='America/New_York' date -d "-21 days" +%Y-%m-%d 2>/dev/null \
                  || TZ='America/New_York' date -v-21d +%Y-%m-%d)
          python mlb_backtest.py "$START" "$END" || echo "backtest step skipped"

      - name: Build MLB dashboard HTML
        run: python mlb_dashboard.py

      # ---- WNBA ----  (keyless too; safe to fail without blocking MLB)
      - name: Run WNBA predictions (ESPN odds + stats.wnba.com) for the window
        run: |
          for D in ${{ steps.target.outputs.dates }}; do
            echo "=== WNBA $D ==="
            python wnba_predict.py "$D" || echo "WNBA $D failed — continuing"
          done

      - name: Grade WNBA picks (CLV + performance)
        continue-on-error: true
        run: |
          END=$(TZ='America/New_York' date +%Y-%m-%d)
          START=$(TZ='America/New_York' date -d "-21 days" +%Y-%m-%d 2>/dev/null \
                  || TZ='America/New_York' date -v-21d +%Y-%m-%d)
          python wnba_backtest.py "$START" "$END" || echo "WNBA backtest skipped"

      - name: Build WNBA dashboard HTML
        run: python wnba_dashboard.py || echo "WNBA dashboard build skipped"

      - name: Commit updated predictions JSON
        # Never let a commit race block the site deploy below. With hourly runs
        # the branch can move while this job runs; we rebase and retry, and if it
        # still can't push, we just skip it — the JSON lands on the next run.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Persistent JSON snapshots keep past days browsable via the calendar;
          # performance.json holds the running CLV/record for the dashboard panel.
          git add data/predictions_*.json data/wnba_predictions_*.json data/performance.json data/wnba_performance.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no prediction changes to commit"
            exit 0
          fi
          git commit -m "auto: predictions $(TZ='America/New_York' date +%Y-%m-%d)"
          # Integrate any commits that landed while we ran, then push (retry a few
          # times in case another run pushes in the same window).
          for i in 1 2 3; do
            git pull --rebase --autostash origin main \
              && git push \
              && { echo "pushed on attempt $i"; break; }
            echo "push attempt $i failed; retrying in 5s..."
            sleep 5
          done

      - name: Prepare Pages site (both dashboards)
        run: |
          mkdir -p site
          cp mlb_dashboard.html site/index.html
          # Publish WNBA only if it built; the tab still shows but links to a page
          # that exists once WNBA has run at least once.
          if [ -f wnba_dashboard.html ]; then cp wnba_dashboard.html site/wnba.html; fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
